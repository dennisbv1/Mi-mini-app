<!DOCTYPE html>
<html>
<head>
    <title>Mi Isla - Juego</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <h1>🏝️ Mi Isla</h1>
    <div id="info">Cargando tus datos...</div>

    <script>
        // Obtener la instancia de Telegram WebApp
        let tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand(); // Expande a pantalla completa

        // Datos del usuario que Telegram nos da
        let user = tg.initDataUnsafe?.user;
        
        if (user) {
            document.getElementById('info').innerHTML = `
                <p>✅ Hola, <strong>${user.first_name} ${user.last_name || ''}</strong>!</p>
                <p>🆔 Tu ID de Telegram: <code>${user.id}</code></p>
                <p>👤 Usuario: @${user.username || 'sin username'}</p>
                <hr>
                <p>⚙️ Este es tu espacio. Pronto podrás alimentar criaturas.</p>
            `;
        } else {
            document.getElementById('info').innerHTML = `
                <p>⚠️ No se pudo obtener el usuario. Asegúrate de abrir esto desde Telegram.</p>
            `;
        }
    </script>
</body>
</html>
